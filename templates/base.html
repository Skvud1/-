<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Русский рэп 2010-х | {{ title if title else 'Главная' }}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-rap">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">RAP 2010+</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/' }}" href="/">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/oxxxy' }}" href="/oxxxy">Oxxxymiron</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/face' }}" href="/face">FACE</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/slava' }}" href="/slava">Слава КПСС</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/glossary' }}" href="/glossary">Глоссарий</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.path == '/about' }}" href="/about">Об авторе</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="footer-rap text-center py-4">
        <div class="container">
            <p>© 2024 Русский рэп 2010-х и современность. Неофициальный фанатский проект.</p>
            <p>
                <a href="https://genius.com/" class="text-decoration-none text-light me-3">Genius</a> |
                <a href="https://www.youtube.com/playlist?list=PL6Jsoaws1w6p7S2Q6jT9QkH4Bf1qCJXzT" class="text-decoration-none text-light ms-3">YouTube-подборка</a>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap виджет: тултипы -->
    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
</body>
</html>
